# Continuous integration — thin caller for the org's reusable ci workflow. It
# discovers the canonical tasks this repo defines via `mise tasks ls
# --name-only` and runs `mise run <task>` for each — here only `lint`
# (addlicense + prettier + markdownlint + actionlint + zizmor via the
# toolchain's common tasks); this common-only repo defines no build or test, so
# those are skipped. The pinned tooling installs via mise from the toolchain
# submodule at .mise/.
#
# Pinned to a full commit SHA (tag in the comment); Renovate keeps it fresh.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:

# the reusable workflow's jobs only need contents:read; grant just that ceiling
permissions:
  contents: read

jobs:
  ci:
    uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@8b34c6fe87a61fc2f800876e9268bc1da8635e88 # v8.0.0
    with:
      # nothing to unit-test here (no test task), so skip the Codecov upload
      coverage: false
